name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v1.0.<run_number>)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Build standalone executables for Linux and Windows
  # ---------------------------------------------------------------------
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            bin_name: Reminder-linux-x86_64
            asset: Reminder-linux-x86_64
          - os: windows-latest
            name: windows
            bin_name: Reminder-windows-x86_64
            asset: Reminder-windows-x86_64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # PySide6 apps need a few extra Qt/xcb libs at runtime on Linux.
      - name: Install Linux system libs
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libegl1 libgl1

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --noconfirm --clean --onefile --windowed
          --name ${{ matrix.bin_name }}
          --collect-submodules app
          main.py

      - name: Verify build (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          ls -lh dist
          test -f "dist/${{ matrix.bin_name }}"
          chmod +x "dist/${{ matrix.bin_name }}"

      - name: Verify build (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (-not (Test-Path "dist/${{ matrix.bin_name }}.exe")) { exit 1 }

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp "dist/${{ matrix.bin_name }}.exe" "out/${{ matrix.asset }}"
          else
            cp "dist/${{ matrix.bin_name }}" "out/${{ matrix.asset }}"
          fi
          ls -lh out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # Publish a GitHub Release with the built executables (no archive)
  # ---------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Compute release tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v1.0.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Reminder ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Reminder-linux-x86_64
            dist/Reminder-windows-x86_64.exe
